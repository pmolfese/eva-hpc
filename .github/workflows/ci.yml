name: Rust reader and viewer
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo build -p eva-viewer -p eva-cli --locked
      - run: cargo run --locked -p eva-mff --example inspect -- crates/eva-mff/tests/fixtures/example_3.mff
      - run: python3 scripts/check-fixtures.py
      - run: python3 scripts/check-consumer.py
  reader-msrv:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
      - run: cargo test -p eva-mff -p eva-core -p eva-cli --locked
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc -p eva-mff -p eva-core --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
