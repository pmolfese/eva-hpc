[package]
name = "eva-viewer"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license-file = "../../LICENSE"

[dependencies]
eva-core = { path = "../eva-core" }
serde_json = "1"
eva-mff = { path = "../eva-mff" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit"] }
rfd = "0.17.2"

[dev-dependencies]
tempfile = "3"
